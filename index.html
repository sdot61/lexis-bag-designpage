<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design | Lexi's Tree Fort</title>
  
  <link rel="icon" sizes="192x192" href="https://static.wixstatic.com/media/9a6a14_328588a7a3164b9e933af5b16a632ddb~mv2.jpg/v1/fill/w_192,h_192,lg_1,usm_0.66_1.00_0.01/9a6a14_328588a7a3164b9e933af5b16a632ddb~mv2.jpg" type="image/jpeg"/>

  <style>
    :root {
      --ltf-teal: #1bb5b2;
      --ltf-pink: #f06292;
      --ltf-darkpink: #e91e63;
      --ltf-yellow: #fcd34d;
      --ltf-orange: #fb923c;
      --ltf-purple: #c084fc;
      --ltf-dark: #222222;
      --site-width: 980px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background-color: #faf9f6;
      color: var(--ltf-dark);
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ========================================================
       CASCADING BACKGROUND SHAPES
       ======================================================== */
    .shape-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      opacity: 0.85;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.04));
    }

    /* Cascading shapes down the left & right sides */
    .shape-1 { top: 60px; left: -40px; width: 180px; height: 160px; fill: var(--ltf-teal); transform: rotate(-15deg); }
    .shape-2 { top: 180px; right: -30px; width: 200px; height: 220px; fill: var(--ltf-pink); transform: rotate(20deg); }
    .shape-3 { top: 380px; left: 2%; width: 140px; height: 150px; fill: var(--ltf-yellow); transform: rotate(45deg); opacity: 0.7; }
    .shape-4 { top: 520px; right: 4%; width: 160px; height: 170px; fill: var(--ltf-teal); transform: rotate(-25deg); opacity: 0.75; }
    .shape-5 { top: 720px; left: -20px; width: 170px; height: 190px; fill: var(--ltf-orange); transform: rotate(12deg); opacity: 0.7; }
    .shape-6 { top: 860px; right: -20px; width: 190px; height: 180px; fill: var(--ltf-purple); transform: rotate(-18deg); opacity: 0.65; }
    .shape-7 { top: 1040px; left: 3%; width: 150px; height: 150px; fill: var(--ltf-pink); transform: rotate(35deg); opacity: 0.6; }

    /* ========================================================
       TOP HEADER & NAVIGATION
       ======================================================== */
    header {
      position: relative;
      z-index: 10;
      width: 100%;
      text-align: center;
      padding-top: 25px;
    }

    .nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      font-size: 0.95rem;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    .nav-bar a {
      color: #333333;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-bar a:hover {
      color: var(--ltf-teal);
    }

    .nav-bar a.active {
      color: var(--ltf-pink);
      font-weight: 700;
    }

    .nav-dot {
      color: #888888;
      font-size: 0.8rem;
    }

    /* Sign Foam Board Header Image */
    .header-banner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .header-banner img {
      max-width: 320px;
      width: 85%;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    /* LTF Logo Badge & Etsy Button */
    .brand-title-badge {
      display: inline-block;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--ltf-teal);
      text-transform: uppercase;
      margin-top: 5px;
    }

    .brand-title-badge span {
      color: var(--ltf-pink);
    }

    .etsy-btn {
      display: inline-block;
      background: #111111;
      color: #ffffff;
      padding: 10px 24px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-decoration: none;
      border-radius: 4px;
      text-transform: uppercase;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 6px;
    }

    .etsy-btn:hover {
      background: var(--ltf-pink);
    }

    /* ========================================================
       WHITE SPACE BODY / WORKSPACE AREA
       ======================================================== */
    main {
      position: relative;
      z-index: 10;
      flex: 1;
      width: 100%;
      max-width: var(--site-width);
      margin: 20px auto 60px auto;
      padding: 0 20px;
    }

    .white-workspace {
      background-color: #ffffff;
      border-radius: 8px;
      min-height: 520px;
      width: 100%;
      padding: 40px 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .workspace-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #333333;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .workspace-placeholder-box {
      width: 100%;
      max-width: 600px;
      min-height: 280px;
      border: 2px dashed #d1d5db;
      border-radius: 8px;
      background: #fbfbfb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      padding: 20px;
      margin-top: 15px;
    }

    /* ========================================================
       FOOTER
       ======================================================== */
    footer {
      position: relative;
      z-index: 10;
      width: 100%;
      text-align: center;
      padding: 30px 20px 40px 20px;
      font-size: 0.85rem;
      color: #666666;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 14px;
    }

    .social-links a {
      color: #444444;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .social-links a:hover {
      color: var(--ltf-teal);
    }
  </style>
</head>
<body>

  <!-- CASCADING BACKGROUND SHAPES (BEHIND CONTENT) -->
  <div class="shape-layer">
    <!-- Shape 1: Teal polygon -->
    <svg class="shape shape-1" viewBox="0 0 100 100"><polygon points="0,20 80,0 100,70 20,100"/></svg>
    <!-- Shape 2: Pink polygon -->
    <svg class="shape shape-2" viewBox="0 0 100 100"><polygon points="20,0 100,20 80,100 0,70"/></svg>
    <!-- Shape 3: Yellow triangle -->
    <svg class="shape shape-3" viewBox="0 0 100 100"><polygon points="50,0 100,100 0,90"/></svg>
    <!-- Shape 4: Teal diamond -->
    <svg class="shape shape-4" viewBox="0 0 100 100"><polygon points="50,0 100,50 50,100 0,50"/></svg>
    <!-- Shape 5: Orange polygon -->
    <svg class="shape shape-5" viewBox="0 0 100 100"><polygon points="10,20 90,0 100,80 10,100"/></svg>
    <!-- Shape 6: Purple polygon -->
    <svg class="shape shape-6" viewBox="0 0 100 100"><polygon points="0,30 70,0 100,80 30,100"/></svg>
    <!-- Shape 7: Pink diamond -->
    <svg class="shape shape-7" viewBox="0 0 100 100"><polygon points="50,0 100,50 50,100 0,50"/></svg>
  </div>

  <!-- SITE HEADER & NAV -->
  <header>
    <!-- Navigation Links -->
    <nav class="nav-bar">
      <a href="https://www.lexistreefort.com/">Home</a>
      <span class="nav-dot">·</span>
      <a href="https://www.lexistreefort.com/shop">Shop</a>
      <span class="nav-dot">·</span>
      <a href="https://www.lexistreefort.com/about">About</a>
      <span class="nav-dot">·</span>
      <a href="https://www.lexistreefort.com/events">Events</a>
      <span class="nav-dot">·</span>
      <a href="https://www.lexistreefort.com/signup">Signup</a>
      <span class="nav-dot">·</span>
      <a href="#" class="active">Design</a>
    </nav>

    <!-- Header Banner Image & Logo -->
    <div class="header-banner">
      <img src="https://static.wixstatic.com/media/9a6a14_a3ab275938d54926930057ca4b9612eb~mv2.jpg/v1/crop/x_42,y_222,w_5977,h_4500/fill/w_320,h_240,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/Machine%20Sign%20Foam%20Board3.jpg" alt="Lexi's Tree Fort Sign">
      
      <div class="brand-title-badge">Lexi's <span>Tree Fort</span></div>

      <a href="https://www.etsy.com/shop/LexisTreeFort" target="_blank" class="etsy-btn">SHOP ON ETSY</a>
    </div>
  </header>

  <!-- BODY CONTENT: CLEAN WHITE SPACE WORKSPACE -->
  <main>
    <div class="white-workspace">
      <h1 class="workspace-title">Custom Bag Designer</h1>
      <p style="color: #64748b; font-size: 0.95rem;">Interactive merchandise workspace</p>

      <div class="workspace-placeholder-box">
        <p>[ Custom Bag Design Application Area ]</p>
      </div>
    </div>
  </main>

  <!-- SITE FOOTER -->
  <footer>
    <div class="social-links">
      <a href="https://www.instagram.com/lexistreefort/" target="_blank">Instagram</a>
      <span class="nav-dot">·</span>
      <a href="https://www.facebook.com/lexistreefort/" target="_blank">Facebook</a>
    </div>
    <p>&copy; 2026 by Lexi's Tree Fort.</p>
  </footer>

</body>
</html>
