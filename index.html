<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const canvas=document.getElementById('scene'),host=document.getElementById('designer');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(host.clientWidth,host.clientHeight,false);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(25,host.clientWidth/host.clientHeight,.1,100);
camera.position.set(5.2,2.7,8.6);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true; controls.enablePan=false; controls.minDistance=7; controls.maxDistance=12;
controls.target.set(0,0,0);

const group=new THREE.Group(); group.visible=false; scene.add(group);
const surfaces=[];
const white=()=>new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide});
const black=()=>new THREE.LineBasicMaterial({color:0x000000});
const leopardTextures={};
function makeLeopardTexture(base){
 const cv=document.createElement('canvas');cv.width=256;cv.height=256;
 const ctx=cv.getContext('2d');ctx.fillStyle=base;ctx.fillRect(0,0,256,256);
 const spots=[
 [18,20,9,6],[48,34,7,5],[79,18,8,5],[112,31,9,6],[147,17,7,5],[178,36,9,6],[216,20,7,5],[240,48,8,5],
 [28,72,8,5],[61,88,10,6],[94,65,7,5],[128,82,9,6],[162,68,8,5],[197,91,10,6],[229,75,7,5],
 [16,122,8,5],[46,140,10,6],[80,119,7,5],[113,145,9,6],[148,125,8,5],[181,148,10,6],[216,126,8,5],[242,154,7,5],
 [25,181,9,6],[59,201,7,5],[91,177,10,6],[125,198,8,5],[159,181,9,6],[193,207,8,5],[226,185,10,6],
 [42,237,8,5],[77,225,9,6],[111,244,7,5],[145,226,10,6],[178,242,8,5],[211,224,9,6],[242,246,7,5]
];
 ctx.fillStyle='#111';spots.forEach(([x,y,rx,ry],i)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,i*.17,0,Math.PI*2);ctx.fill()});
 const tex=new THREE.CanvasTexture(cv);tex.wrapS=THREE.ClampToEdgeWrapping;tex.wrapT=THREE.ClampToEdgeWrapping;tex.needsUpdate=true;return tex;
}
leopardTextures['leopard-yellow']=makeLeopardTexture('#f3d23b');
leopardTextures['leopard-pink']=makeLeopardTexture('#f06292');

function roundedPanel(name,w,h,r,z,x=0,rotationY=0){
  const shape=new THREE.Shape();
  shape.moveTo(-w/2+r,-h/2); shape.lineTo(w/2-r,-h/2);
  shape.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
  shape.lineTo(w/2,h/2-r); shape.quadraticCurveTo(w/2,h/2,w/2-r,h/2);
  shape.lineTo(-w/2+r,h/2); shape.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);
  shape.lineTo(-w/2,-h/2+r); shape.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
  const geo=new THREE.ExtrudeGeometry(shape,{depth:.16,bevelEnabled:true,bevelSegments:4,bevelSize:.06,bevelThickness:.045,curveSegments:12});
  const mesh=new THREE.Mesh(geo,white()); mesh.userData.surface=name; mesh.userData.width=w; mesh.userData.height=h; mesh.userData.clipPolygon=shape.getPoints(24).map(p=>p.clone());
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo,12),black());
  const pair=new THREE.Group();
  pair.position.set(x,0,z);
  pair.rotation.y=rotationY;
  pair.add(mesh,edges); group.add(pair); surfaces.push(mesh);
  return pair;
}

// All bag panels have rounded corners and complete perimeter outlines.
roundedPanel('front',3.45,2.45,.30,.55);
roundedPanel('back',3.45,2.45,.30,-.62);

// The bag is a rounded rectangular prism:
// X = length (left/right), Y = height, Z = width (front/back).
// Side panels are Height × Width surfaces at the two extreme X boundaries.
// Their positions stay fixed at those boundaries while the panel itself spans Z.
roundedPanel('side 1',1.17,2.18,.24,-.035,-1.725,Math.PI/2);
roundedPanel('side 2',1.17,2.18,.24,-.035,1.725,Math.PI/2);

const bottomShape=new THREE.Shape();
bottomShape.moveTo(-1.55,-.22);
bottomShape.quadraticCurveTo(-.8,-.42,0,-.45);
bottomShape.quadraticCurveTo(.8,-.42,1.55,-.22);
bottomShape.lineTo(1.55,.22);
bottomShape.quadraticCurveTo(.8,.42,0,.45);
bottomShape.quadraticCurveTo(-.8,.42,-1.55,.22);
bottomShape.closePath();
const bottomGeo=new THREE.ExtrudeGeometry(bottomShape,{depth:.12,bevelEnabled:true,bevelSegments:4,bevelSize:.05,bevelThickness:.04,curveSegments:12});
const bottom=new THREE.Mesh(bottomGeo,white()); bottom.rotation.x=Math.PI/2; bottom.position.set(0,-1.22,-.03); bottom.userData.surface='bottom'; bottom.userData.width=3.10; bottom.userData.height=.90; bottom.userData.clipPolygon=bottomShape.getPoints(24).map(p=>p.clone());
const bottomEdges=new THREE.LineSegments(new THREE.EdgesGeometry(bottomGeo,12),black()); bottomEdges.position.copy(bottom.position); bottomEdges.rotation.copy(bottom.rotation);
group.add(bottom,bottomEdges); surfaces.push(bottom);

// Rounded front cover rather than a square box.
const flapShape=new THREE.Shape();
flapShape.moveTo(-1.55,-.42);
flapShape.quadraticCurveTo(-1.48,-.58,-1.28,-.58);
flapShape.lineTo(1.28,-.58);
flapShape.quadraticCurveTo(1.48,-.58,1.55,-.42);
flapShape.lineTo(1.55,.42);
flapShape.quadraticCurveTo(1.48,.56,1.28,.56);
flapShape.lineTo(-1.28,.56);
flapShape.quadraticCurveTo(-1.48,.56,-1.55,.42);
flapShape.closePath();
const flapGeo=new THREE.ExtrudeGeometry(flapShape,{depth:.16,bevelEnabled:true,bevelSegments:4,bevelSize:.06,bevelThickness:.045,curveSegments:12});
const flap=new THREE.Mesh(flapGeo,white()); flap.position.set(0,1.70,.47); flap.rotation.x=-.16; flap.userData.surface='front cover'; flap.userData.width=3.10; flap.userData.height=1.14; flap.userData.clipPolygon=flapShape.getPoints(24).map(p=>p.clone());
const flapEdges=new THREE.LineSegments(new THREE.EdgesGeometry(flapGeo,12),black()); flapEdges.position.copy(flap.position); flapEdges.rotation.copy(flap.rotation);
group.add(flap,flapEdges); surfaces.push(flap);


// Permanent hinge panel: a large, colorable rectangle between the rear bag body and front cover.
// It is intentionally not eligible for added polygons.
const hingeGeo=new THREE.PlaneGeometry(3.05,.48);
const hinge=new THREE.Mesh(hingeGeo,white());
hinge.position.set(0,1.27,.66);
hinge.userData.surface='hinge';
hinge.userData.width=3.05;
hinge.userData.height=.48;
hinge.userData.noPolygons=true;
hinge.userData.clipPolygon=[new THREE.Vector2(-3.05/2,-.48/2),new THREE.Vector2(3.05/2,-.48/2),new THREE.Vector2(3.05/2,.48/2),new THREE.Vector2(-3.05/2,.48/2)];
const hingeEdges=new THREE.LineSegments(new THREE.EdgesGeometry(hingeGeo),black());
hingeEdges.position.copy(hinge.position);
group.add(hinge,hingeEdges);
surfaces.push(hinge);

// Exterior bridge surface: a separate, color-only rectangle sitting outside the bag
// across the gap/border between the top flap and the back panel.
const bridgeGeo=new THREE.PlaneGeometry(3.45,.86);
const bridge=new THREE.Mesh(bridgeGeo,white());
bridge.position.set(0,1.27,.86); bridge.rotation.x=-.16;
bridge.userData.surface='flap-back bridge';
bridge.userData.width=3.45;
bridge.userData.height=.72;
bridge.userData.noPolygons=true;
bridge.userData.clipPolygon=[new THREE.Vector2(-3.45/2,-.72/2),new THREE.Vector2(3.45/2,-.72/2),new THREE.Vector2(3.45/2,.72/2),new THREE.Vector2(-3.45/2,.72/2)];
const bridgeEdges=new THREE.LineSegments(new THREE.EdgesGeometry(bridgeGeo),black());
bridgeEdges.position.copy(bridge.position); bridgeEdges.rotation.copy(bridge.rotation);
group.add(bridge,bridgeEdges);
surfaces.push(bridge);

// Curved opening contour.
const curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(-1.40,1.34,.61),new THREE.Vector3(0,1.05,.70),new THREE.Vector3(1.40,1.34,.61));
group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(48)),black()));

// Continuous rounded strap.
const strapCurve=new THREE.CatmullRomCurve3([
 new THREE.Vector3(-1.42,1.45,.15),new THREE.Vector3(-2.05,2.45,-.15),
 new THREE.Vector3(-1.75,3.55,-.55),new THREE.Vector3(0,4.05,-.72),
 new THREE.Vector3(1.75,3.55,-.55),new THREE.Vector3(2.05,2.45,-.15),
 new THREE.Vector3(1.42,1.45,.15)
]);
const strapGeo=new THREE.TubeGeometry(strapCurve,64,.045,10,false);
group.add(new THREE.LineSegments(new THREE.EdgesGeometry(strapGeo,18),black()));
group.scale.set(.78,.78,.78); group.position.y=-.35; group.rotation.set(0,-.28,0);

const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
let hovered=null,selectedSurface=null,selectedTarget=null,targetSpeed=0,targetPitch=0,polygonOrientation=null;
const surfaceOrientations=new Map();
let draggingHandle=null,dragPlane=null,dragStart=null;
ray.params.Line.threshold=.035;
const polygonCounts=new Map();
const polygonRecords=new Map();
const surfaceTool=document.getElementById('surfaceTool');
const polygonPicker=document.getElementById('polygonPicker');
const polygonMenu=document.getElementById('polygonMenu');
const polygonPickerToggle=document.getElementById('polygonPickerToggle');
const deleteShapeButton=document.getElementById('deleteShape');

function baseSurface(obj){return obj?.userData.baseSurface||obj||null}
function designColor(obj){return obj?.userData.designColor||0xffffff}
function hover(obj,on){
 if(!obj?.material)return;
 obj.material.color.set(on?0xd9f5f5:designColor(obj));
}
function applyDesign(obj,button){
 if(!obj)return;
 const pattern=button.dataset.pattern;
 if(pattern){
   obj.material.map=leopardTextures[pattern];
   obj.material.color.set(0xffffff);
   obj.material.needsUpdate=true;
   obj.userData.designColor=0xffffff;
 }else{
   obj.material.map=null;
   obj.material.color.set(button.dataset.color);
   obj.material.needsUpdate=true;
   obj.userData.designColor=new THREE.Color(button.dataset.color);
 }
}
function setToolPosition(clientX,clientY){
 const rect=host.getBoundingClientRect();
 let x=clientX-rect.left+16,y=clientY-rect.top+16;
 x=Math.max(8,Math.min(x,rect.width-162)); y=Math.max(8,Math.min(y,rect.height-205));
 surfaceTool.style.left=x+'px';surfaceTool.style.top=y+'px';
}
function openSurfaceTool(surface,target,clientX,clientY){
 selectedSurface=surface;
 selectedTarget=target;
 surfaceTool.classList.add('open');
 setToolPosition(clientX,clientY);
 polygonMenu.classList.remove('open');
 updatePolygonStatus();
}
function updatePolygonStatus(){
 const base=selectedSurface,status=document.getElementById('polygonStatus');
 const records=base?(polygonRecords.get(base)||[]):[];
 if(!base){status.textContent='Select a surface.';polygonPicker.classList.remove('visible');deleteShapeButton.classList.remove('visible');return}
 if(base.userData.surface==='flap-back bridge'){
   status.textContent='Accessory · color only';
   polygonPicker.classList.remove('visible');
   deleteShapeButton.classList.remove('visible');
   document.querySelectorAll('.orientation-option').forEach(x=>x.classList.remove('active'));
   return;
 }
 if(base.userData.noPolygons){
   status.textContent='Hinge · color only';
   polygonPicker.classList.remove('visible');
   deleteShapeButton.classList.remove('visible');
   document.querySelectorAll('.orientation-option').forEach(x=>x.classList.remove('active'));
   return;
 }
 polygonOrientation=surfaceOrientations.get(base)||null;
 status.textContent=base.userData.surface+' · '+records.length+'/4 shapes'+(polygonOrientation?' · '+polygonOrientation+' angle':'');
 polygonPicker.classList.toggle('visible',!!polygonOrientation&&records.length<4);
 deleteShapeButton.classList.toggle('visible',!!selectedTarget?.userData?.shapeRecord);
 if(records.length>=4) polygonPickerToggle.textContent='Maximum reached';
 else polygonPickerToggle.innerHTML='Choose Shape <span>▾</span>';
 document.querySelectorAll('.orientation-option').forEach(x=>{
   x.disabled=!!polygonOrientation||records.length>0;
   x.classList.toggle('active',x.dataset.orientation===polygonOrientation);
 });
}
const shapeTemplates={
 slight:.055,
 medium:.085,
 strong:.115,
 wide:.15
};

function boundaryFromShift(leftBoundary,span,shift){
  return {
    bottom:leftBoundary.bottom+span,
    top:leftBoundary.top+span+shift
  };
}

function clipPolygon(points,axis,value,keepGreater){
  const out=[];
  for(let i=0;i<points.length;i++){
    const P=points[i],Q=points[(i+1)%points.length];
    const pIn=keepGreater?(P[axis]>=value):(P[axis]<=value);
    const qIn=keepGreater?(Q[axis]>=value):(Q[axis]<=value);
    if(pIn!==qIn){
      const denom=Q[axis]-P[axis];
      if(Math.abs(denom)>1e-9){
        const t=(value-P[axis])/denom;
        out.push(new THREE.Vector2(P.x+(Q.x-P.x)*t,P.y+(Q.y-P.y)*t));
      }
    }
    if(qIn)out.push(Q.clone());
  }
  return out;
}

function clipAgainstConvexPolygon(points,clipPoints){
  if(!clipPoints?.length)return points;
  let subject=points.map(p=>p.clone()),area=0;
  for(let i=0;i<clipPoints.length;i++){const A=clipPoints[i],B=clipPoints[(i+1)%clipPoints.length];area+=A.x*B.y-B.x*A.y}
  const winding=area>=0?1:-1;
  for(let i=0;i<clipPoints.length;i++){
    if(subject.length<3)break;
    const A=clipPoints[i],B=clipPoints[(i+1)%clipPoints.length],next=[];
    for(let j=0;j<subject.length;j++){
      const P=subject[j],Q=subject[(j+1)%subject.length];
      const cP=((B.x-A.x)*(P.y-A.y)-(B.y-A.y)*(P.x-A.x))*winding;
      const cQ=((B.x-A.x)*(Q.y-A.y)-(B.y-A.y)*(Q.x-A.x))*winding;
      const pIn=cP>=-1e-9,qIn=cQ>=-1e-9;
      if(pIn!==qIn){const den=cP-cQ;if(Math.abs(den)>1e-12){const t=cP/den;next.push(new THREE.Vector2(P.x+(Q.x-P.x)*t,P.y+(Q.y-P.y)*t))}}
      if(qIn)next.push(Q.clone());
    }
    subject=next;
  }
  return subject;
}
function clipSegmentAgainstConvexPolygon(a,b,clipPoints){
  if(!clipPoints?.length)return [a.clone(),b.clone()];
  const d=b.clone().sub(a);let area=0;
  for(let i=0;i<clipPoints.length;i++){const A=clipPoints[i],B=clipPoints[(i+1)%clipPoints.length];area+=A.x*B.y-B.x*A.y}
  const winding=area>=0?1:-1;let t0=0,t1=1;
  for(let i=0;i<clipPoints.length;i++){
    const A=clipPoints[i],B=clipPoints[(i+1)%clipPoints.length],ex=B.x-A.x,ey=B.y-A.y;
    const c0=(ex*(a.y-A.y)-ey*(a.x-A.x))*winding,cd=(ex*d.y-ey*d.x)*winding;
    if(Math.abs(cd)<1e-12){if(c0<-1e-9)return [];continue}
    const t=-c0/cd;if(cd>0)t0=Math.max(t0,t);else t1=Math.min(t1,t);if(t0>t1+1e-9)return [];
  }
  return [a.clone().addScaledVector(d,t0),b.clone().addScaledVector(d,t1)];
}
function clippedOriginalPerimeter(raw,clipPoints){
  const segments=[];
  for(let i=0;i<raw.length;i++){const seg=clipSegmentAgainstConvexPolygon(raw[i],raw[(i+1)%raw.length],clipPoints);if(seg.length===2)segments.push(seg[0],seg[1])}
  return segments;
}
function rebuildShape(record){
  const surface=record.surface,w=surface.userData.width,h=surface.userData.height;
  const bottom=-h/2,top=h/2;

  // Every shape owns its right boundary. The next shape reuses that exact
  // boundary as its left boundary, so adjacent shapes can never develop a gap
  // or mismatched slant.
  if(!record.leftBoundary){
    const span=Math.max(.0001,(record.end-record.start)*w);
    const shift=w*(shapeTemplates[record.shapeName]??.085)*(record.orientation==='left'?-1:1);
    record.leftBoundary={bottom:-w/2-shift/2,top:-w/2+shift/2};
    record.rightBoundary=boundaryFromShift(record.leftBoundary,span,0);
  }

  const raw=[
    new THREE.Vector2(record.leftBoundary.bottom,bottom),
    new THREE.Vector2(record.rightBoundary.bottom,bottom),
    new THREE.Vector2(record.rightBoundary.top,top),
    new THREE.Vector2(record.leftBoundary.top,top)
  ];

  // Clip the actual shape against the surface. Anything outside is not
  // rendered. This naturally eats corners at the top/bottom and produces
  // polygons where a corner reaches a surface corner.
  // Clip against the actual surface silhouette, not merely its rectangular
  // bounds. This makes rounded corners and custom surfaces true ownership
  // boundaries: when a shape reaches the surface contour, the surface owns
  // nothing beyond that contour.
  let clipped=record.surface.userData.clipPolygon
    ? clipAgainstConvexPolygon(raw,record.surface.userData.clipPolygon)
    : raw;
  // Keep exact rectangular fallback behavior for any surface without a
  // contour definition.
  if(!record.surface.userData.clipPolygon){
    clipped=clipPolygon(clipped,'x',-w/2,true);
    clipped=clipPolygon(clipped,'x',w/2,false);
    clipped=clipPolygon(clipped,'y',bottom,true);
    clipped=clipPolygon(clipped,'y',top,false);
  }
  if(clipped.length<3)return;

  const shape=new THREE.Shape();
  shape.moveTo(clipped[0].x,clipped[0].y);
  clipped.slice(1).forEach(p=>shape.lineTo(p.x,p.y));
  shape.closePath();

  if(record.mesh)surface.remove(record.mesh);
  if(record.handle)surface.remove(record.handle);
  if(record.edge)surface.remove(record.edge);

  record.mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape),
    new THREE.MeshBasicMaterial({color:record.color||0xd9f5f5,side:THREE.DoubleSide}));
  record.mesh.userData.baseSurface=surface;
  record.mesh.userData.shapeRecord=record;
  record.mesh.userData.surface=surface.userData.surface+' shape '+(record.index+1);
  record.mesh.userData.designColor=record.color||0xd9f5f5;
  if(record.texture){
    record.mesh.material.map=record.texture;
    record.mesh.material.color.set(0xffffff);
  }
  const shapeZ=(surface.userData.surface==='front'||surface.userData.surface==='front cover'||surface.userData.surface==='hinge')?.24:-.24;
  record.mesh.position.z=shapeZ;
  surface.add(record.mesh);

  // Draw only original perimeter segments that remain on the surface.
  // The clipping boundary itself is not drawn, so no artificial line appears where the shape passes behind the bag edge.
  const edgeZ=shapeZ+.009;
  const perimeter=record.surface.userData.clipPolygon ? clippedOriginalPerimeter(raw,record.surface.userData.clipPolygon) : raw;
  const edgePoints=perimeter.map(p=>new THREE.Vector3(p.x,p.y,edgeZ));
  record.edge=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(edgePoints),new THREE.LineBasicMaterial({color:0x000000}));
  record.edge.userData.shapeRecord=record;
  surface.add(record.edge);

  // Only the right boundary is a hit target. It is invisible, so the visible
  // boundary remains the actual shape edge rather than a second adjustment line.
  const handlePoints=[
    new THREE.Vector3(record.rightBoundary.bottom,bottom,shapeZ+.015),
    new THREE.Vector3(record.rightBoundary.top,top,shapeZ+.015)
  ];
  record.handle=new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(handlePoints),
    new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.9,depthTest:false})
  );
  record.handle.userData.shapeRecord=record;
  record.handle.userData.isShapeHandle=true;
  record.handle.userData.isBoundaryHandle=true;
  record.handle.userData.isWorkingHandle=true;
  record.handle.renderOrder=20;
  surface.add(record.handle);
}

function rebuildSurface(surface){
  const records=polygonRecords.get(surface)||[];
  records.forEach((r,i)=>{r.index=i;rebuildShape(r)});
}

function addPolygonToSurface(surface,shapeName){
  if(!surface||surface.userData.noPolygons)return;
  const records=polygonRecords.get(surface)||[];
  const orientation=surfaceOrientations.get(surface);
  if(records.length>=4||!orientation)return;

  const minUnit=1/5;
  const w=surface.userData.width;
  const span=minUnit*w;

  let leftBoundary;
  if(records.length){
    leftBoundary=records[records.length-1].rightBoundary;
  }else{
    // The first allocation is exactly the first 1/5 of the surface width.
    // Its left edge is the surface edge itself, rather than a slanted edge
    // that straddles the surface. This guarantees that the first shape owns
    // the entire leftmost unit of surface.
    leftBoundary={bottom:-w/2,top:-w/2};
  }

  const shift=w*(shapeTemplates[shapeName]??.085)*(orientation==='left'?-1:1);
  const rightBoundary=boundaryFromShift(leftBoundary,span,shift);

  const record={
    surface,index:records.length,start:records.length?records[records.length-1].end:0,
    end:(records.length+1)*minUnit,shapeName,orientation,
    color:0xd9f5f5,texture:null,leftBoundary,rightBoundary
  };
  records.push(record);
  polygonRecords.set(surface,records);

  rebuildSurface(surface);
  selectedTarget=record.mesh;
  selectedSurface=surface;
  polygonMenu.classList.remove('open');
  updatePolygonStatus();
}

function surfaceIntersection(e,surface){
  const r=canvas.getBoundingClientRect();
  const p=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-(((e.clientY-r.top)/r.height)*2-1));
  ray.setFromCamera(p,camera);
  const localRay=ray.ray.clone();
  const inv=new THREE.Matrix4().copy(surface.matrixWorld).invert();
  localRay.applyMatrix4(inv);
  // Shapes live at local z=.24 above their surface.
  const plane=new THREE.Plane(new THREE.Vector3(0,0,1),-.24);
  const hit=new THREE.Vector3();
  return plane.intersectLine(
    new THREE.Line3(localRay.origin,localRay.origin.clone().add(localRay.direction.multiplyScalar(1000))),
    hit
  )?hit:null;
}

function updateDraggedShape(e){
  if(!draggingHandle)return;
  const p=surfaceIntersection(e,draggingHandle.surface);
  if(!p)return;
  targetSpeed=0;targetPitch=0;

  const surface=draggingHandle.surface;
  const records=polygonRecords.get(surface)||[];
  const record=draggingHandle.record;
  const i=record.index;
  const minUnit=1/5;
  const proposed=(p.x+surface.userData.width/2)/surface.userData.width;
  const minRight=record.start+minUnit;
  // Adjacent shapes may encroach on one another. A shape only has to retain
  // its own minimum width; its neighbor's boundary can move into its space.
  const maxRight=i<records.length-1?records[i+1].end:1.35;
  const newEnd=Math.max(minRight,Math.min(maxRight,proposed));
  const delta=(newEnd-record.end)*surface.userData.width;

  // Translate only the right boundary. If another shape exists, its left
  // boundary is the same object, so it moves with it automatically.
  record.rightBoundary.bottom+=delta;
  record.rightBoundary.top+=delta;
  record.end=newEnd;

  for(let j=i+1;j<records.length;j++){
    records[j].start=records[j-1].end;
    records[j].leftBoundary=records[j-1].rightBoundary;
  }

  rebuildSurface(surface);
  selectedTarget=record.mesh;
  updatePolygonStatus();
}

canvas.addEventListener('pointermove',e=>{
 const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 pointer.x=x*2-1;pointer.y=-y*2+1;
 if(draggingHandle){updateDraggedShape(e);targetSpeed=0;targetPitch=0;return}
 const recordsForSurface=selectedSurface?(polygonRecords.get(selectedSurface)||[]):[];
 const shapeWorkActive=!!polygonOrientation||recordsForSurface.length>0;
 const edge=Math.max(0,(Math.abs(x-.5)-.32)/.18);
 targetSpeed=shapeWorkActive?0:(x<.18?1:x>.82?-1:0)*edge*.018;
 const verticalEdge=Math.max(0,(Math.abs(y-.5)-.32)/.18);
 targetPitch=shapeWorkActive?0:(y<.18?-.018:y>.82?.018:0)*verticalEdge;
 ray.setFromCamera(pointer,camera);
 const hoverObjects=[];
 surfaces.forEach(surface=>hoverObjects.push(surface));
 polygonRecords.forEach(records=>records.forEach(record=>{
   if(record.mesh)hoverObjects.push(record.mesh);
 }));
 const hoverHit=ray.intersectObjects(hoverObjects,false).sort((a,b)=>a.distance-b.distance)[0]?.object||null;
 if(hoverHit!==hovered){hover(hovered,false);hovered=hoverHit;if(hovered)hover(hovered,true)}
 const handleHit=ray.intersectObjects(
   [...polygonRecords.values()].flat().map(r=>r.handle).filter(h=>h?.userData?.isWorkingHandle),
   false
 ).sort((a,b)=>a.distance-b.distance)[0]?.object;
 canvas.classList.toggle('shape-cursor',!!handleHit);
});
canvas.addEventListener('pointerdown',e=>{
 const r=canvas.getBoundingClientRect();
 pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-(((e.clientY-r.top)/r.height)*2-1);
 ray.setFromCamera(pointer,camera);
 const handles=[];
 polygonRecords.forEach(records=>records.forEach(record=>{if(record.handle)handles.push(record.handle)}));
 const h=ray.intersectObjects(handles.filter(x=>x.userData?.isWorkingHandle),false)
   .sort((a,b)=>a.distance-b.distance)[0]?.object;
 if(h?.userData?.isShapeHandle){
   const record=h.userData.shapeRecord;
   targetSpeed=0; targetPitch=0;
   controls.enabled=false;
   draggingHandle={record,surface:record.surface};
   selectedSurface=record.surface;selectedTarget=record.mesh;
   canvas.setPointerCapture(e.pointerId);
   targetSpeed=0;targetPitch=0;
   return;
 }
},true);
canvas.addEventListener('pointerup',e=>{
 if(draggingHandle){draggingHandle=null;controls.enabled=true;canvas.releasePointerCapture(e.pointerId);canvas.classList.remove('shape-cursor')}
});
function foregroundHit(clientX,clientY){
 const r=canvas.getBoundingClientRect();
 const ndc=new THREE.Vector2(
   ((clientX-r.left)/r.width)*2-1,
   -(((clientY-r.top)/r.height)*2-1)
 );
 ray.setFromCamera(ndc,camera);

 // Resolve selection from the camera outward. The first actual rendered
 // surface or shape intersected by the ray is the only selectable object.
 // In particular, never use selectedSurface as a fallback: a previously
 // edited member of a front/back pair must not capture clicks on its mate.
 const objects=[];
 surfaces.forEach(surface=>objects.push(surface));
 polygonRecords.forEach(records=>records.forEach(record=>{
   if(record.mesh)objects.push(record.mesh);
 }));
 const hits=ray.intersectObjects(objects,false).sort((a,b)=>a.distance-b.distance);
 for(const hit of hits){
   const obj=hit.object;
   if(obj?.userData?.shapeRecord)return obj;
   if(obj?.userData?.surface)return obj;
 }
 return null;
}

canvas.addEventListener('click',e=>{
 if(draggingHandle)return;
 const hit=foregroundHit(e.clientX,e.clientY);
 if(hit?.userData?.isWorkingHandle)return;
 if(hit){
   const base=baseSurface(hit);
   selectedTarget=hit;
   openSurfaceTool(base,hit,e.clientX,e.clientY);
 }
});

  document.querySelectorAll('.polygon-choice polygon').forEach(poly=>poly.setAttribute('points',poly.dataset[orientation]||poly.dataset.right));
}
updateShapeChoiceDirection('right');
document.querySelectorAll('.orientation-option').forEach(b=>b.addEventListener('click',e=>{
 e.stopPropagation();
 if(!selectedSurface||selectedSurface.userData.noPolygons)return;
 const orientation=b.dataset.orientation;
 if(orientation!=='left'&&orientation!=='right')return;
 surfaceOrientations.set(selectedSurface,orientation);
 polygonOrientation=orientation;

 b.classList.add('active');
 selectedTarget=selectedSurface;

}));
document.getElementById('resetPolygons').addEventListener('click',e=>{
 e.stopPropagation();
 if(!selectedSurface||selectedSurface.userData.noPolygons)return;
 const records=polygonRecords.get(selectedSurface)||[];
 records.forEach(r=>{
   if(r.mesh)selectedSurface.remove(r.mesh);
   if(r.handle)selectedSurface.remove(r.handle);
   if(r.edge)selectedSurface.remove(r.edge);
 });
 polygonRecords.set(selectedSurface,[]);
 surfaceOrientations.delete(selectedSurface);
 polygonOrientation=null;selectedTarget=null;
 document.querySelectorAll('.orientation-option').forEach(x=>{x.disabled=false;x.classList.remove('active')});
 updatePolygonStatus();
});
deleteShapeButton.addEventListener('click',e=>{
 e.stopPropagation();
 const record=selectedTarget?.userData?.shapeRecord;
 if(!record)return;
 const surface=record.surface;
 const records=polygonRecords.get(surface)||[];
 const idx=records.indexOf(record);
 if(idx<0)return;

 // Remove every rendered object for the current surface before rebuilding it.
 records.forEach(r=>{
   if(r.mesh)surface.remove(r.mesh);
   if(r.handle)surface.remove(r.handle);
   if(r.edge)surface.remove(r.edge);
 });
 records.splice(idx,1);

 if(records.length===0){
   polygonRecords.set(surface,[]);
   surfaceOrientations.delete(surface);
   polygonOrientation=null;
   selectedTarget=null;
   selectedSurface=surface;
   updatePolygonStatus();
   return;
 }

 // Rebuild the boundary chain from left to right. The new first shape gets
 // the same special left-edge treatment as an originally added first shape.
 const w=surface.userData.width;
 const orientation=surfaceOrientations.get(surface)||records[0].orientation||'right';
 records.forEach((r,i)=>{
   r.index=i;
   r.orientation=orientation;
   r.start=i===0?0:records[i-1].end;
   if(i===0){
     const shift=w*(shapeTemplates[r.shapeName]??.085)*(orientation==='left'?-1:1);
     r.leftBoundary={bottom:-w/2-shift/2,top:-w/2+shift/2};
   }else{
     r.leftBoundary=records[i-1].rightBoundary;
   }
   r.end=Math.max(r.start+1/5,(r.rightBoundary.bottom-r.leftBoundary.bottom+w*0)/w+w/2/w);
 });

 // Keep the stored widths internally consistent with the actual shared
 // boundaries, then rebuild all shapes in one pass.
 records.forEach((r,i)=>{
   r.start=i===0?0:records[i-1].end;
   r.end=Math.min(1.35,r.start+(r.rightBoundary.bottom-r.leftBoundary.bottom)/w);
 });
 polygonRecords.set(surface,records);
 rebuildSurface(surface);
 selectedSurface=surface;
 selectedTarget=null;
 updatePolygonStatus();
});

});

addEventListener('resize',resize);
function animate(){requestAnimationFrame(animate);const shapeMode=!!polygonOrientation||!!draggingHandle||!controls.enabled;if(shapeMode){targetSpeed=0;targetPitch=0}group.rotation.y+=shapeMode?0:targetSpeed;group.rotation.x=Math.max(-.95,Math.min(.95,group.rotation.x+(shapeMode?0:targetPitch)));controls.update();renderer.render(scene,camera)} animate();
