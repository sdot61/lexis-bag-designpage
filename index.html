<style>
:root{--teal:#1bb5b2;--purple:#9b5de5;--ink:#000;--hover:#d9f5f5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;color:#222}body{background:#fff}

.nav-bar{display:flex;justify-content:center;align-items:center;gap:14px;margin:12px 0 24px;transform:translateX(-170px)}
.nav-bar a{padding:8px 18px;color:#fff;background:var(--teal);border:2px solid var(--teal);border-radius:999px;text-decoration:none;font-size:16px;line-height:1.2;font-weight:400}
.nav-bar a:first-child{background:var(--purple);border-color:var(--purple)}
.nav-bar a:hover{filter:brightness(.95)}
.header-banner{margin-bottom:18px}.header-banner img{max-width:150px;width:40%;height:auto}
main{width:100%;max-width:1180px;margin:10px auto 70px;padding:0 20px}
.white-workspace{background:#fff;min-height:820px;padding:45px 35px;display:flex;flex-direction:column;align-items:center}
.workspace-title{font-size:1.5rem;font-weight:700;letter-spacing:1px;color:#333;margin:0 0 34px;text-transform:uppercase}
.designer-layout{width:100%;max-width:1160px;display:grid;grid-template-columns:190px minmax(520px,1fr) 190px;gap:24px;align-items:stretch}
.designer-side,.designer-main{min-height:650px;background:#fff;border:2px solid #000;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.designer-side{border-radius:18px;padding:28px 20px;text-align:left}.controls-panel{display:flex;flex-direction:column}.designer-main{border-radius:0;position:relative;overflow:hidden}
.panel-title{font-size:16px;font-weight:700;margin:0 0 22px}.bag-choice{border:0;background:none;padding:0;font:inherit;font-size:16px;color:#222;cursor:pointer;text-align:left}.bag-choice:hover{text-decoration:underline}
.panel-rule{border:0;border-top:2px dashed #000;margin:24px 0}
.size-options{display:flex;flex-direction:column;gap:12px}.size-option{border:0;background:none;padding:0;font:inherit;font-size:15px;text-align:left;cursor:pointer}.size-option:hover{text-decoration:underline}.size-option.active{font-weight:700}
.color-title{font-size:13px;margin:0 0 9px}.swatch-list{display:grid;grid-template-columns:1fr 1fr;gap:7px 5px}.swatch{display:flex;align-items:center;gap:5px;border:0;background:none;padding:0;font:inherit;font-size:10px;cursor:pointer;text-align:left;min-width:0}.smudge{width:22px;height:17px;flex:0 0 22px;display:inline-block;border-radius:55% 42% 62% 38% / 48% 58% 42% 52%;transform:rotate(-7deg);box-shadow:inset 3px 1px 0 rgba(255,255,255,.22),inset -2px -1px 0 rgba(0,0,0,.08)}.smudge.teal{background:#1bb5b2}.smudge.white{background:#fff;border:1px solid #aaa}.smudge.pink{background:#f06292}.smudge.purple{background:#9b5de5}.smudge.black{background:#111}.smudge.beige{background:#e8d3b0}.smudge.orange{background:#f28c28}.smudge.yellow{background:#f6d743}.smudge.leopard-yellow{background-color:#f3d23b;background-image:radial-gradient(ellipse at 35% 35%,#111 0 18%,transparent 20%),radial-gradient(ellipse at 70% 65%,#111 0 16%,transparent 18%),radial-gradient(ellipse at 75% 25%,#111 0 10%,transparent 12%)}.smudge.leopard-pink{background-color:#f06292;background-image:radial-gradient(ellipse at 35% 35%,#111 0 18%,transparent 20%),radial-gradient(ellipse at 70% 65%,#111 0 16%,transparent 18%),radial-gradient(ellipse at 75% 25%,#111 0 10%,transparent 12%)}.polygon-tools{margin-top:12px}.polygon-status{font-size:9px;line-height:1.3;color:#666;margin:0 0 7px;min-height:24px}.orientation-options{display:flex;gap:4px;margin-bottom:7px}.orientation-option,.polygon-add,.polygon-reset{border:1px solid #000;background:#fff;border-radius:999px;padding:5px 6px;font:inherit;font-size:9px;cursor:pointer}.orientation-option.active{background:#000;color:#fff}.orientation-option:disabled{opacity:.45;cursor:default}.polygon-add{width:100%;margin-bottom:5px}.polygon-add:disabled{opacity:.4;cursor:default}.polygon-reset{width:100%;font-size:8px}.add-cart{margin-top:auto;width:100%;border:2px solid #daa520;border-radius:999px;background:#daa520;color:#fff;padding:10px 8px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.add-cart:hover{filter:brightness(.96)}
#scene{width:100%;height:100%;min-height:650px;display:block}.designer-main:before{content:"";position:absolute;left:12%;right:12%;bottom:7%;height:1px;background:rgba(0,0,0,.06)}
.bag-hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;color:#777;pointer-events:none}
footer{text-align:center;padding:30px 20px 40px;font-size:.85rem;color:#666}.social-links{display:flex;justify-content:center;gap:18px;margin-bottom:14px}.social-links a{color:#444;text-decoration:none;font-weight:600}
@media(max-width:900px){.nav-bar{transform:none;flex-wrap:wrap}.designer-layout{grid-template-columns:1fr 1fr}.designer-main{grid-column:1/-1;grid-row:1}.designer-side{min-height:180px}}
@media(max-width:560px){.designer-layout{grid-template-columns:1fr}.designer-main{grid-column:auto}.designer-side{min-height:160px}}
</style>

<header>

<div class="header-banner"><img src="https://static.wixstatic.com/media/9a6a14_b0a7629f76d040879556d83d4db846db~mv2.jpg/v1/crop/x_5,y_0,w_604,h_672/fill/w_150,h_167,al_c,q_80,usm_0.66_1.00_0.01/LTF_logoTealPink.jpg" alt="Lexi's Tree Fort"></div>
</header>
<main><div class="white-workspace">
<h1 class="workspace-title">Custom Bag Designer</h1>
<div class="designer-layout">
<aside class="designer-side">
<h2 class="panel-title">Bags</h2>
<button class="bag-choice" id="messengerButton">Messenger Bag</button>
</aside>
<section class="designer-main" id="designer">
<canvas id="scene"></canvas><div class="bag-hint">Move toward either edge to rotate · move back over the bag to inspect surfaces</div>
</section>
<aside class="designer-side controls-panel">
<h2 class="panel-title">Size</h2>
<div class="size-options"><button class="size-option active">Small</button><button class="size-option">Medium</button><button class="size-option">Large</button></div>
<hr class="panel-rule">
<h3 class="color-title">Colors</h3>
<div class="swatch-list">
<button class="swatch" data-color="#1bb5b2"><span class="smudge teal"></span>Teal</button>
<button class="swatch" data-color="#ffffff"><span class="smudge white"></span>White</button>
<button class="swatch" data-color="#f06292"><span class="smudge pink"></span>Hot Pink</button>
<button class="swatch" data-color="#9b5de5"><span class="smudge purple"></span>Purple</button>
<button class="swatch" data-color="#111111"><span class="smudge black"></span>Black</button>
<button class="swatch" data-color="#e8d3b0"><span class="smudge beige"></span>Beige</button>
<button class="swatch" data-color="#f28c28"><span class="smudge orange"></span>Orange</button>
<button class="swatch" data-color="#f6d743"><span class="smudge yellow"></span>Yellow</button>
<button class="swatch" data-pattern="leopard-yellow"><span class="smudge leopard-yellow"></span>Leopard Yellow</button>
<button class="swatch" data-pattern="leopard-pink"><span class="smudge leopard-pink"></span>Leopard Pink</button>
</div>
<div class="polygon-tools">
<h3 class="color-title">Surface Design</h3>
<p class="polygon-status" id="polygonStatus">Hover a bag surface to select it.</p>
<div class="orientation-options">
<button class="orientation-option" data-orientation="right">Right ↗</button>
<button class="orientation-option" data-orientation="left">Left ↖</button>
</div>
<button class="polygon-add" id="addPolygon" disabled>Add Polygon</button>
<button class="polygon-reset" id="resetPolygons">Reset Polygons</button>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const canvas=document.getElementById('scene'),host=document.getElementById('designer');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(host.clientWidth,host.clientHeight,false);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(25,host.clientWidth/host.clientHeight,.1,100);
camera.position.set(5.2,2.7,8.6);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true; controls.enablePan=false; controls.minDistance=7; controls.maxDistance=12;
controls.target.set(0,0,0);

const group=new THREE.Group(); group.visible=false; scene.add(group);
const surfaces=[];
const white=()=>new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide});
const black=()=>new THREE.LineBasicMaterial({color:0x000000});
const leopardTextures={};
function makeLeopardTexture(base){
 const cv=document.createElement('canvas');cv.width=256;cv.height=256;
 const ctx=cv.getContext('2d');ctx.fillStyle=base;ctx.fillRect(0,0,256,256);
 const spots=[[42,55,18,11],[96,40,15,10],[161,62,20,12],[215,42,13,9],[55,132,22,14],[125,112,16,11],[194,137,22,14],[35,205,14,10],[101,216,21,13],[170,204,15,10],[224,220,21,13]];
 ctx.fillStyle='#111';spots.forEach(([x,y,rx,ry],i)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,i*.17,0,Math.PI*2);ctx.fill()});
 const tex=new THREE.CanvasTexture(cv);return tex;
}
leopardTextures['leopard-yellow']=makeLeopardTexture('#f3d23b');
leopardTextures['leopard-pink']=makeLeopardTexture('#f06292');

function roundedPanel(name,w,h,r,z,x=0,rotationY=0){
  const shape=new THREE.Shape();
  shape.moveTo(-w/2+r,-h/2); shape.lineTo(w/2-r,-h/2);
  shape.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
  shape.lineTo(w/2,h/2-r); shape.quadraticCurveTo(w/2,h/2,w/2-r,h/2);
  shape.lineTo(-w/2+r,h/2); shape.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);
  shape.lineTo(-w/2,-h/2+r); shape.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
  const geo=new THREE.ExtrudeGeometry(shape,{depth:.16,bevelEnabled:true,bevelSegments:4,bevelSize:.06,bevelThickness:.045,curveSegments:12});
  const mesh=new THREE.Mesh(geo,white()); mesh.userData.surface=name; mesh.userData.width=w; mesh.userData.height=h;
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo,12),black());
  const pair=new THREE.Group();
  pair.position.set(x,0,z);
  pair.rotation.y=rotationY;
  pair.add(mesh,edges); group.add(pair); surfaces.push(mesh);
  return pair;
}

// All bag panels have rounded corners and complete perimeter outlines.
roundedPanel('front',3.45,2.45,.30,.55);
roundedPanel('back',3.45,2.45,.30,-.62);

// The bag is a rounded rectangular prism:
// X = length (left/right), Y = height, Z = width (front/back).
// Side panels are Height × Width surfaces at the two extreme X boundaries.
// Their positions stay fixed at those boundaries while the panel itself spans Z.
roundedPanel('side 1',1.17,2.18,.24,-.035,-1.725,Math.PI/2);
roundedPanel('side 2',1.17,2.18,.24,-.035,1.725,Math.PI/2);

const bottomShape=new THREE.Shape();
bottomShape.moveTo(-1.55,-.22);
bottomShape.quadraticCurveTo(-.8,-.42,0,-.45);
bottomShape.quadraticCurveTo(.8,-.42,1.55,-.22);
bottomShape.lineTo(1.55,.22);
bottomShape.quadraticCurveTo(.8,.42,0,.45);
bottomShape.quadraticCurveTo(-.8,.42,-1.55,.22);
bottomShape.closePath();
const bottomGeo=new THREE.ExtrudeGeometry(bottomShape,{depth:.12,bevelEnabled:true,bevelSegments:4,bevelSize:.05,bevelThickness:.04,curveSegments:12});
const bottom=new THREE.Mesh(bottomGeo,white()); bottom.rotation.x=Math.PI/2; bottom.position.set(0,-1.22,-.03); bottom.userData.surface='bottom'; bottom.userData.width=3.10; bottom.userData.height=.90;
const bottomEdges=new THREE.LineSegments(new THREE.EdgesGeometry(bottomGeo,12),black()); bottomEdges.position.copy(bottom.position); bottomEdges.rotation.copy(bottom.rotation);
group.add(bottom,bottomEdges); surfaces.push(bottom);

// Rounded front cover rather than a square box.
const flapShape=new THREE.Shape();
flapShape.moveTo(-1.55,-.42);
flapShape.quadraticCurveTo(-1.48,-.58,-1.28,-.58);
flapShape.lineTo(1.28,-.58);
flapShape.quadraticCurveTo(1.48,-.58,1.55,-.42);
flapShape.lineTo(1.55,.42);
flapShape.quadraticCurveTo(1.48,.56,1.28,.56);
flapShape.lineTo(-1.28,.56);
flapShape.quadraticCurveTo(-1.48,.56,-1.55,.42);
flapShape.closePath();
const flapGeo=new THREE.ExtrudeGeometry(flapShape,{depth:.16,bevelEnabled:true,bevelSegments:4,bevelSize:.06,bevelThickness:.045,curveSegments:12});
const flap=new THREE.Mesh(flapGeo,white()); flap.position.set(0,1.70,.47); flap.rotation.x=-.16; flap.userData.surface='front cover'; flap.userData.width=3.10; flap.userData.height=1.14;
const flapEdges=new THREE.LineSegments(new THREE.EdgesGeometry(flapGeo,12),black()); flapEdges.position.copy(flap.position); flapEdges.rotation.copy(flap.rotation);
group.add(flap,flapEdges); surfaces.push(flap);

// Curved opening contour.
const curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(-1.40,1.34,.61),new THREE.Vector3(0,1.05,.70),new THREE.Vector3(1.40,1.34,.61));
group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(48)),black()));

// Continuous rounded strap.
const strapCurve=new THREE.CatmullRomCurve3([
 new THREE.Vector3(-1.42,1.45,.15),new THREE.Vector3(-2.05,2.45,-.15),
 new THREE.Vector3(-1.75,3.55,-.55),new THREE.Vector3(0,4.05,-.72),
 new THREE.Vector3(1.75,3.55,-.55),new THREE.Vector3(2.05,2.45,-.15),
 new THREE.Vector3(1.42,1.45,.15)
]);
const strapGeo=new THREE.TubeGeometry(strapCurve,64,.045,10,false);
group.add(new THREE.LineSegments(new THREE.EdgesGeometry(strapGeo,18),black()));
group.scale.set(.78,.78,.78); group.position.y=-.35; group.rotation.set(0,-.28,0);

const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
let hovered=null,targetSpeed=0,targetPitch=0,polygonOrientation=null;
const polygonCounts=new Map();

function baseSurface(obj){return obj?.userData.baseSurface||obj||null}
function hover(obj,on){
 if(!obj?.material)return;
 obj.material.color.set(on?0xd9f5f5:(obj.userData.designColor||0xffffff));
}
function applyDesign(obj,button){
 if(!obj)return;
 const pattern=button.dataset.pattern;
 if(pattern){
   obj.material.map=leopardTextures[pattern];
   obj.material.color.set(0xffffff);
   obj.material.needsUpdate=true;
   obj.userData.designColor=0xffffff;
 }else{
   obj.material.map=null;
   obj.material.color.set(button.dataset.color);
   obj.material.needsUpdate=true;
   obj.userData.designColor=new THREE.Color(button.dataset.color);
 }
}
function updatePolygonStatus(){
 const base=baseSurface(hovered),status=document.getElementById('polygonStatus'),add=document.getElementById('addPolygon');
 const count=base?(polygonCounts.get(base)||0):0;
 status.textContent=base?base.userData.surface+' · '+count+'/4 polygons'+(polygonOrientation?' · '+polygonOrientation+' angle':''):'Hover a bag surface to select it.';
 add.disabled=!base||count>=4||!polygonOrientation;
}
function polygonPoints(surface,index){
 const w=surface.userData.width,h=surface.userData.height,inset=Math.min(.07,w*.025,h*.025);
 const x0=-w/2+inset,x1=w/2-inset,y0=-h/2+inset,y1=h/2-inset;
 const delta=Math.min(w*.075,w*.18)*(polygonOrientation==='right'?1:-1);
 const lines=[];
 for(let i=1;i<=4;i++){const f=i/5;lines.push({bottom:x0+(x1-x0)*f,top:x0+(x1-x0)*f+delta});}
 const left=index===0?{bottom:x0,top:x0}:lines[index-1],right=lines[index];
 return [new THREE.Vector2(left.bottom,y0),new THREE.Vector2(right.bottom,y0),new THREE.Vector2(right.top,y1),new THREE.Vector2(left.top,y1)];
}
function addPolygonToSurface(surface){
 const count=polygonCounts.get(surface)||0;if(!surface||count>=4||!polygonOrientation)return;
 const poly=new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(polygonPoints(surface,count))),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));
 poly.position.z=.171;poly.userData.baseSurface=surface;poly.userData.surface=surface.userData.surface+' polygon '+(count+1);poly.userData.designColor=0xffffff;
 surface.add(poly);polygonCounts.set(surface,count+1);updatePolygonStatus();
}
canvas.addEventListener('pointermove',e=>{
 const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 pointer.x=x*2-1;pointer.y=-y*2+1;
 const edge=Math.max(0,(Math.abs(x-.5)-.32)/.18);targetSpeed=(x<.18?1:x>.82?-1:0)*edge*.018;
 const verticalEdge=Math.max(0,(Math.abs(y-.5)-.32)/.18);targetPitch=(y<.18?-.018:y>.82?.018:0)*verticalEdge;
 ray.setFromCamera(pointer,camera);
 const hit=ray.intersectObjects(surfaces,true)[0]?.object||null;
 if(hit!==hovered){hover(hovered,false);hovered=hit;hovered&&hovered.material&&hovered.material.color.set(0xd9f5f5)}
 updatePolygonStatus();
});
canvas.addEventListener('pointerleave',()=>{hover(hovered,false);hovered=null;targetSpeed=0;targetPitch=0;updatePolygonStatus()});
document.getElementById('messengerButton').addEventListener('click',()=>group.visible=true);
document.querySelectorAll('.size-option').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.size-option').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));
document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{if(hovered)applyDesign(hovered,b)}));
document.querySelectorAll('.orientation-option').forEach(b=>b.addEventListener('click',()=>{
 if(polygonOrientation)return;
 polygonOrientation=b.dataset.orientation;
 document.querySelectorAll('.orientation-option').forEach(x=>{x.disabled=true;x.classList.toggle('active',x===b)});
 updatePolygonStatus();
}));
document.getElementById('addPolygon').addEventListener('click',()=>addPolygonToSurface(baseSurface(hovered)));
document.getElementById('resetPolygons').addEventListener('click',()=>{
 surfaces.forEach(surface=>{for(let i=surface.children.length-1;i>=0;i--){const child=surface.children[i];if(child.userData?.baseSurface===surface)surface.remove(child)}});
 polygonCounts.clear();polygonOrientation=null;
 document.querySelectorAll('.orientation-option').forEach(x=>{x.disabled=false;x.classList.remove('active')});
 updatePolygonStatus();
});
document.getElementById('addCart').addEventListener('click',()=>{
 const size=document.querySelector('.size-option.active')?.textContent.trim()||'Small';
 const item={product:'Messenger Bag',size,addedAt:new Date().toISOString()};
 const cart=JSON.parse(localStorage.getItem('lexisTreeFortCart')||'[]');cart.push(item);localStorage.setItem('lexisTreeFortCart',JSON.stringify(cart));
 const button=document.getElementById('addCart');button.textContent='Added to Cart!';setTimeout(()=>button.textContent='Add to Cart!',1400);
});
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
function animate(){requestAnimationFrame(animate);group.rotation.y+=targetSpeed;group.rotation.x=Math.max(-.95,Math.min(.95,group.rotation.x+targetPitch));controls.update();renderer.render(scene,camera)} animate();
</script>
</body></html>
