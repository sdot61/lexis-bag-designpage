.color-title{font-size:13px;margin:0 0 9px}.swatch-list{display:grid;grid-template-columns:1fr 1fr;gap:7px 5px}.swatch{display:flex;align-items:center;gap:5px;border:0;background:none;padding:0;font:inherit;font-size:10px;cursor:pointer;text-align:left;min-width:0}.smudge{width:22px;height:17px;flex:0 0 22px;display:inline-block;border-radius:55% 42% 62% 38% / 48% 58% 42% 52%;transform:rotate(-7deg);box-shadow:inset 3px 1px 0 rgba(255,255,255,.22),inset -2px -1px 0 rgba(0,0,0,.08)}.smudge.teal{background:#1bb5b2}.smudge.white{background:#fff;border:1px solid #aaa}.smudge.pink{background:#f06292}.smudge.purple{background:#9b5de5}.smudge.black{background:#111}.smudge.beige{background:#e8d3b0}.smudge.orange{background:#f28c28}.smudge.yellow{background:#f6d743}.smudge.leopard-yellow{background-color:#f3d23b;background-image:radial-gradient(ellipse at 35% 35%,#111 0 18%,transparent 20%),radial-gradient(ellipse at 70% 65%,#111 0 16%,transparent 18%),radial-gradient(ellipse at 75% 25%,#111 0 10%,transparent 12%)}.smudge.leopard-pink{background-color:#f06292;background-image:radial-gradient(ellipse at 35% 35%,#111 0 18%,transparent 20%),radial-gradient(ellipse at 70% 65%,#111 0 16%,transparent 18%),radial-gradient(ellipse at 75% 25%,#111 0 10%,transparent 12%)}.surface-tool{position:absolute;z-index:8;display:none;width:154px;padding:9px;background:#fff;border:2px solid #000;border-radius:10px;box-shadow:3px 3px 0 rgba(0,0,0,.12);font-size:10px}.surface-tool.open{display:block}.surface-tool-title{font-size:11px;font-weight:700;margin-bottom:5px}.polygon-status{font-size:9px;line-height:1.25;color:#666;margin:0 0 6px;min-height:22px}.orientation-options{display:flex;gap:4px;margin-bottom:6px}.orientation-option,.polygon-reset,.shape-delete{border:1px solid #000;background:#fff;border-radius:999px;padding:4px 5px;font:inherit;font-size:8px;cursor:pointer;flex:1}.orientation-option.active{background:#000;color:#fff}.orientation-option:disabled{opacity:.45;cursor:default}.polygon-picker{display:none;position:relative;margin-bottom:5px}.polygon-picker.visible{display:block}.polygon-picker-toggle{width:100%;border:1px solid #000;background:#fff;border-radius:5px;padding:5px 6px;font:inherit;font-size:8px;text-align:left;cursor:pointer}.polygon-picker-toggle span{float:right}.polygon-menu{display:none;position:absolute;left:0;right:0;top:100%;z-index:12;background:#fff;border:1px solid #000;border-radius:5px;padding:3px;margin-top:2px}.polygon-menu.open{display:grid;grid-template-columns:1fr 1fr;gap:2px}.polygon-choice{border:0;background:#fff;padding:3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}.polygon-choice:hover{background:#eee}.polygon-choice svg{width:38px;height:22px;display:block}.polygon-choice polygon{fill:#d9f5f5;stroke:#000;stroke-width:1.5}.polygon-choice span{font-size:7px}.polygon-reset{width:100%;font-size:8px}.shape-delete{width:100%;margin-top:5px;border-color:#d33;color:#c22;font-weight:700;display:none;align-items:center;justify-content:center;gap:4px}.shape-delete.visible{display:flex}.shape-delete .delete-x{font-size:14px;line-height:9px;color:#d33;font-weight:900}.shape-handle{stroke:#000;stroke-width:2;cursor:ew-resize}.shape-handle-hover{stroke-width:4}.shape-cursor{cursor:ew-resize!important}.add-cart{margin-top:auto;width:100%;border:2px solid #daa520;border-radius:999px;background:#daa520;color:#fff;padding:10px 8px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.add-cart:hover{filter:brightness(.96)}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const canvas=document.getElementById('scene'),host=document.getElementById('designer');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(host.clientWidth,host.clientHeight,false);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(25,host.clientWidth/host.clientHeight,.1,100);
camera.position.set(5.2,2.7,8.6);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true; controls.enablePan=false; controls.minDistance=7; controls.maxDistance=12;
controls.target.set(0,0,0);

const group=new THREE.Group(); group.visible=false; scene.add(group);
const surfaces=[];
const white=()=>new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide});
const black=()=>new THREE.LineBasicMaterial({color:0x000000});
const leopardTextures={};
function makeLeopardTexture(base){
 const cv=document.createElement('canvas');cv.width=256;cv.height=256;
 const ctx=cv.getContext('2d');ctx.fillStyle=base;ctx.fillRect(0,0,256,256);
 const spots=[[42,55,18,11],[96,40,15,10],[161,62,20,12],[215,42,13,9],[55,132,22,14],[125,112,16,11],[194,137,22,14],[35,205,14,10],[101,216,21,13],[170,204,15,10],[224,220,21,13]];
 ctx.fillStyle='#111';spots.forEach(([x,y,rx,ry],i)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,i*.17,0,Math.PI*2);ctx.fill()});
 const tex=new THREE.CanvasTexture(cv);return tex;
}
leopardTextures['leopard-yellow']=makeLeopardTexture('#f3d23b');
leopardTextures['leopard-pink']=makeLeopardTexture('#f06292');

function roundedPanel(name,w,h,r,z,x=0,rotationY=0){
  const shape=new THREE.Shape();
  shape.moveTo(-w/2+r,-h/2); shape.lineTo(w/2-r,-h/2);
  shape.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
  shape.lineTo(w/2,h/2-r); shape.quadraticCurveTo(w/2,h/2,w/2-r,h/2);
  shape.lineTo(-w/2+r,h/2); shape.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);
  shape.lineTo(-w/2,-h/2+r); shape.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
  const geo=new THREE.ExtrudeGeometry(shape,{depth:.16,bevelEnabled:true,bevelSegments:4,bevelSize:.06,bevelThickness:.045,curveSegments:12});
  const mesh=new THREE.Mesh(geo,white()); mesh.userData.surface=name; mesh.userData.width=w; mesh.userData.height=h;
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo,12),black());
  const pair=new THREE.Group();
  pair.position.set(x,0,z);
  pair.rotation.y=rotationY;
  pair.add(mesh,edges); group.add(pair); surfaces.push(mesh);
  return pair;
}

// All bag panels have rounded corners and complete perimeter outlines.
roundedPanel('front',3.45,2.45,.30,.55);
roundedPanel('back',3.45,2.45,.30,-.62);

// The bag is a rounded rectangular prism:
// X = length (left/right), Y = height, Z = width (front/back).
// Side panels are Height × Width surfaces at the two extreme X boundaries.
// Their positions stay fixed at those boundaries while the panel itself spans Z.
roundedPanel('side 1',1.17,2.18,.24,-.035,-1.725,Math.PI/2);
roundedPanel('side 2',1.17,2.18,.24,-.035,1.725,Math.PI/2);

const bottomShape=new THREE.Shape();
bottomShape.moveTo(-1.55,-.22);
bottomShape.quadraticCurveTo(-.8,-.42,0,-.45);
bottomShape.quadraticCurveTo(.8,-.42,1.55,-.22);
bottomShape.lineTo(1.55,.22);
bottomShape.quadraticCurveTo(.8,.42,0,.45);
bottomShape.quadraticCurveTo(-.8,.42,-1.55,.22);
bottomShape.closePath();
const bottomGeo=new THREE.ExtrudeGeometry(bottomShape,{depth:.12,bevelEnabled:true,bevelSegments:4,bevelSize:.05,bevelThickness:.04,curveSegments:12});
const bottom=new THREE.Mesh(bottomGeo,white()); bottom.rotation.x=Math.PI/2; bottom.position.set(0,-1.22,-.03); bottom.userData.surface='bottom'; bottom.userData.width=3.10; bottom.userData.height=.90;
const bottomEdges=new THREE.LineSegments(new THREE.EdgesGeometry(bottomGeo,12),black()); bottomEdges.position.copy(bottom.position); bottomEdges.rotation.copy(bottom.rotation);
group.add(bottom,bottomEdges); surfaces.push(bottom);

// Rounded front cover rather than a square box.
const flapShape=new THREE.Shape();
flapShape.moveTo(-1.55,-.42);
flapShape.quadraticCurveTo(-1.48,-.58,-1.28,-.58);
flapShape.lineTo(1.28,-.58);
flapShape.quadraticCurveTo(1.48,-.58,1.55,-.42);
flapShape.lineTo(1.55,.42);
flapShape.quadraticCurveTo(1.48,.56,1.28,.56);
flapShape.lineTo(-1.28,.56);
flapShape.quadraticCurveTo(-1.48,.56,-1.55,.42);
flapShape.closePath();
const flapGeo=new THREE.ExtrudeGeometry(flapShape,{depth:.16,bevelEnabled:true,bevelSegments:4,bevelSize:.06,bevelThickness:.045,curveSegments:12});
const flap=new THREE.Mesh(flapGeo,white()); flap.position.set(0,1.70,.47); flap.rotation.x=-.16; flap.userData.surface='front cover'; flap.userData.width=3.10; flap.userData.height=1.14;
const flapEdges=new THREE.LineSegments(new THREE.EdgesGeometry(flapGeo,12),black()); flapEdges.position.copy(flap.position); flapEdges.rotation.copy(flap.rotation);
group.add(flap,flapEdges); surfaces.push(flap);


// Permanent hinge panel: a large, colorable rectangle between the rear bag body and front cover.
// It is intentionally not eligible for added polygons.
const hingeGeo=new THREE.PlaneGeometry(3.05,.34);
const hinge=new THREE.Mesh(hingeGeo,white());
hinge.position.set(0,1.27,.66);
hinge.userData.surface='hinge';
hinge.userData.width=3.05;
hinge.userData.height=.34;
hinge.userData.noPolygons=true;
const hingeEdges=new THREE.LineSegments(new THREE.EdgesGeometry(hingeGeo),black());
hingeEdges.position.copy(hinge.position);
group.add(hinge,hingeEdges);
surfaces.push(hinge);

// Curved opening contour.
const curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(-1.40,1.34,.61),new THREE.Vector3(0,1.05,.70),new THREE.Vector3(1.40,1.34,.61));
group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(48)),black()));

// Continuous rounded strap.
const strapCurve=new THREE.CatmullRomCurve3([
 new THREE.Vector3(-1.42,1.45,.15),new THREE.Vector3(-2.05,2.45,-.15),
 new THREE.Vector3(-1.75,3.55,-.55),new THREE.Vector3(0,4.05,-.72),
 new THREE.Vector3(1.75,3.55,-.55),new THREE.Vector3(2.05,2.45,-.15),
 new THREE.Vector3(1.42,1.45,.15)
]);
const strapGeo=new THREE.TubeGeometry(strapCurve,64,.045,10,false);
group.add(new THREE.LineSegments(new THREE.EdgesGeometry(strapGeo,18),black()));
group.scale.set(.78,.78,.78); group.position.y=-.35; group.rotation.set(0,-.28,0);

const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
let hovered=null,selectedSurface=null,selectedTarget=null,targetSpeed=0,targetPitch=0,polygonOrientation=null;
const surfaceOrientations=new Map();
let draggingHandle=null,dragPlane=null,dragStart=null;
ray.params.Line.threshold=.035;
const polygonCounts=new Map();
const polygonRecords=new Map();
const surfaceTool=document.getElementById('surfaceTool');
const polygonPicker=document.getElementById('polygonPicker');
const polygonMenu=document.getElementById('polygonMenu');
const polygonPickerToggle=document.getElementById('polygonPickerToggle');
const deleteShapeButton=document.getElementById('deleteShape');

function baseSurface(obj){return obj?.userData.baseSurface||obj||null}
function designColor(obj){return obj?.userData.designColor||0xffffff}
function hover(obj,on){
 if(!obj?.material)return;
 obj.material.color.set(on?0xd9f5f5:designColor(obj));
}
function applyDesign(obj,button){
 if(!obj)return;
 const pattern=button.dataset.pattern;
 if(pattern){
   obj.material.map=leopardTextures[pattern];
   obj.material.color.set(0xffffff);
   obj.material.needsUpdate=true;
   obj.userData.designColor=0xffffff;
 }else{
   obj.material.map=null;
   obj.material.color.set(button.dataset.color);
   obj.material.needsUpdate=true;
   obj.userData.designColor=new THREE.Color(button.dataset.color);
 }
}
function setToolPosition(clientX,clientY){
 const rect=host.getBoundingClientRect();
 let x=clientX-rect.left+16,y=clientY-rect.top+16;
 x=Math.max(8,Math.min(x,rect.width-162)); y=Math.max(8,Math.min(y,rect.height-205));
 surfaceTool.style.left=x+'px';surfaceTool.style.top=y+'px';
}
function openSurfaceTool(surface,target,clientX,clientY){
 selectedSurface=surface;
 selectedTarget=target;
 surfaceTool.classList.add('open');
 setToolPosition(clientX,clientY);
 polygonMenu.classList.remove('open');
 updatePolygonStatus();
}
function updatePolygonStatus(){
 const base=selectedSurface,status=document.getElementById('polygonStatus');
 const records=base?(polygonRecords.get(base)||[]):[];
 if(!base){status.textContent='Select a surface.';polygonPicker.classList.remove('visible');deleteShapeButton.classList.remove('visible');return}
 if(base.userData.noPolygons){
   status.textContent='Hinge · color only';
   polygonPicker.classList.remove('visible');
   deleteShapeButton.classList.remove('visible');
   return;
 }
 polygonOrientation=surfaceOrientations.get(base)||null;
 status.textContent=base.userData.surface+' · '+records.length+'/5 shapes'+(polygonOrientation?' · '+polygonOrientation+' angle':'');
 polygonPicker.classList.toggle('visible',records.length<5);
 deleteShapeButton.classList.toggle('visible',!!selectedTarget?.userData?.shapeRecord);
 if(records.length>=5) polygonPickerToggle.textContent='Maximum reached';
 else polygonPickerToggle.innerHTML='Choose Shape <span>▾</span>';
}
const shapeTemplates={
 slight:.06,
 medium:.11,
 strong:.17,
 wide:.23
};
function rebuildShape(record){
 const surface=record.surface, w=surface.userData.width,h=surface.userData.height;
 const orientation=record.orientation||surfaceOrientations.get(surface)||'right';
 const inset=Math.min(.045,w*.02,h*.02);
 const surfaceLeft=-w/2+inset, surfaceRight=w/2-inset;
 const allocationLeft=left, allocationRight=right;
 const left=record.start*w-w/2+inset;
 const right=record.end*w-w/2-inset;
 const span=Math.max(.0001,right-left);
 const magnitude=Math.min(span*.38,w*.12)*(orientation==='right'?1:-1);
 const bottomShift=polygonOrientation==='right'?magnitude:-magnitude;
 const topShift=bottomShift;
 // Build the intended parallelogram, then clip it to the actual surface rectangle.
 const raw=[
   new THREE.Vector2(left,-h/2+inset),
   new THREE.Vector2(right,-h/2+inset),
   new THREE.Vector2(right+topShift,h/2-inset),
   new THREE.Vector2(left+topShift,h/2-inset)
 ];
 const rect=new THREE.Shape();
 rect.moveTo(surfaceLeft,-h/2+inset);
 rect.lineTo(surfaceRight,-h/2+inset);
 rect.lineTo(surfaceRight,h/2-inset);
 rect.lineTo(surfaceLeft,h/2-inset);
 rect.closePath();
 const poly=new THREE.Path(raw.map((p,i)=>i===0?new THREE.Vector2(p.x,p.y):new THREE.Vector2(p.x,p.y)));
 // Sutherland-Hodgman clipping against the surface rectangle.
 function clip(points,axis,value,keepGreater){
   const out=[];
   for(let i=0;i<points.length;i++){
     const P=points[i],Q=points[(i+1)%points.length];
     const pIn=keepGreater?(P[axis]>=value):(P[axis]<=value);
     const qIn=keepGreater?(Q[axis]>=value):(Q[axis]<=value);
     if(pIn!==qIn){
       const t=(value-P[axis])/(Q[axis]-P[axis]);
       out.push(new THREE.Vector2(P.x+(Q.x-P.x)*t,P.y+(Q.y-P.y)*t));
     }
     if(qIn)out.push(Q.clone());
   }
   return out;
 }
 let clipped=raw;
 clipped=clip(clipped,'x',Math.max(surfaceLeft,allocationLeft),true);
 clipped=clip(clipped,'x',Math.min(surfaceRight,allocationRight),false);
 clipped=clip(clipped,'y',-h/2+inset,true);
 clipped=clip(clipped,'y',h/2-inset,false);
 if(clipped.length<3)return;
 const shape=new THREE.Shape();
 shape.moveTo(clipped[0].x,clipped[0].y);
 clipped.slice(1).forEach(p=>shape.lineTo(p.x,p.y));
 shape.closePath();

 if(record.mesh)surface.remove(record.mesh);
 if(record.handle)surface.remove(record.handle);
 if(record.edge)surface.remove(record.edge);

 record.mesh=new THREE.Mesh(
   new THREE.ShapeGeometry(shape),
   new THREE.MeshBasicMaterial({color:record.color||0xd9f5f5,side:THREE.DoubleSide})
 );
 record.mesh.userData.baseSurface=surface;
 record.mesh.userData.shapeRecord=record;
 record.mesh.userData.surface=surface.userData.surface+' shape '+(record.index+1);
 record.mesh.userData.designColor=record.color||0xd9f5f5;
 if(record.texture){
   record.mesh.material.map=record.texture;
   record.mesh.material.color.set(0xffffff);
 }
 record.mesh.position.z=.24;
 surface.add(record.mesh);

 const edgePoints=clipped.map(p=>new THREE.Vector3(p.x,p.y,.249));
 edgePoints.push(edgePoints[0].clone());
 record.edge=new THREE.Line(new THREE.BufferGeometry().setFromPoints(edgePoints),new THREE.LineBasicMaterial({color:0x000000}));
 record.edge.userData.shapeRecord=record;
 surface.add(record.edge);

 // Only the actual right perimeter is an adjustment handle.
 const rightX=Math.min(right,surfaceRight);
 const lineGeo=new THREE.BufferGeometry().setFromPoints([
   new THREE.Vector3(rightX,-h/2+inset,.251),
   new THREE.Vector3(rightX,h/2-inset,.251)
 ]);
 record.handle=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:0x000000}));
 record.handle.userData.shapeRecord=record;
 record.handle.userData.isShapeHandle=true;
 record.handle.userData.isRightHandle=true;
 surface.add(record.handle);
}
function rebuildSurface(surface){
 const records=polygonRecords.get(surface)||[];
 records.forEach((r,i)=>{r.index=i; rebuildShape(r)});
}
function addPolygonToSurface(surface,shapeName){
 if(!surface||surface.userData.noPolygons)return;
 const records=polygonRecords.get(surface)||[];
 if(records.length>=5||!polygonOrientation)return;
 const minUnit=1/5;
 const start=records.length?records[records.length-1].end:0;
 const end=Math.min(1,start+minUnit);
 if(end<=start)return;
 const record={surface,index:records.length,start,end,shapeName,orientation:surfaceOrientations.get(surface)||'right',color:0xd9f5f5,texture:null};
 records.push(record);
 polygonRecords.set(surface,records);
 selectedTarget=null;
 rebuildShape(record);
 selectedTarget=record.mesh;
 polygonMenu.classList.remove('open');
 updatePolygonStatus();
}
function surfaceIntersection(e,surface){
 const r=canvas.getBoundingClientRect();
 const p=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-(((e.clientY-r.top)/r.height)*2-1));
 ray.setFromCamera(p,camera);
 const localRay=ray.ray.clone();
 const inv=new THREE.Matrix4().copy(surface.matrixWorld).invert();
 localRay.applyMatrix4(inv);
 const plane=new THREE.Plane(new THREE.Vector3(0,0,1),-.171);
 const hit=new THREE.Vector3();
 return plane.intersectLine(new THREE.Line3(localRay.origin,localRay.origin.clone().add(localRay.direction.multiplyScalar(1000))),hit)?hit:null;
}
function updateDraggedShape(e){
 if(!draggingHandle)return;
 const p=surfaceIntersection(e,draggingHandle.surface);
 if(!p)return;
 targetSpeed=0; targetPitch=0;
 const surface=draggingHandle.surface,records=polygonRecords.get(surface)||[],record=draggingHandle.record;
 const i=record.index,minUnit=1/5;
 const minEnd=record.start+minUnit;
 const maxEnd=i<records.length-1 ? records[i+1].end-minUnit : 1;
 record.end=Math.max(minEnd,Math.min(maxEnd,(p.x+surface.userData.width/2)/surface.userData.width));
 for(let j=i+1;j<records.length;j++){
   const width=records[j].end-records[j].start;
   records[j].start=records[j-1].end;
   records[j].end=Math.min(1,records[j].start+Math.max(minUnit,width));
 }
 rebuildSurface(surface);
 selectedTarget=record.mesh;
 updatePolygonStatus();
}
canvas.addEventListener('pointermove',e=>{
 const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 pointer.x=x*2-1;pointer.y=-y*2+1;
 if(draggingHandle){updateDraggedShape(e);targetSpeed=0;targetPitch=0;return}
 const recordsForSurface=selectedSurface?(polygonRecords.get(selectedSurface)||[]):[];
 const shapeWorkActive=!!polygonOrientation||recordsForSurface.length>0;
 const edge=Math.max(0,(Math.abs(x-.5)-.32)/.18);
 targetSpeed=shapeWorkActive?0:(x<.18?1:x>.82?-1:0)*edge*.018;
 const verticalEdge=Math.max(0,(Math.abs(y-.5)-.32)/.18);
 targetPitch=shapeWorkActive?0:(y<.18?-.018:y>.82?.018:0)*verticalEdge;
 ray.setFromCamera(pointer,camera);
 const hit=ray.intersectObjects(surfaces,true)[0]?.object||null;
 if(hit!==hovered){hover(hovered,false);hovered=hit;if(hovered)hover(hovered,true)}
 const handleHit=ray.intersectObjects(surfaces.flatMap(s=>(polygonRecords.get(s)||[]).map(r=>r.handle).filter(h=>h?.userData?.isRightHandle)),true)[0]?.object;
 canvas.classList.toggle('shape-cursor',!!handleHit);
});
canvas.addEventListener('pointerdown',e=>{
 const r=canvas.getBoundingClientRect();
 pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-(((e.clientY-r.top)/r.height)*2-1);
 ray.setFromCamera(pointer,camera);
 const handles=[];
 polygonRecords.forEach(records=>records.forEach(record=>{if(record.handle)handles.push(record.handle)}));
 const h=ray.intersectObjects(handles.filter(x=>x.userData?.isRightHandle),true)[0]?.object;
 if(h?.userData?.isShapeHandle){
   const record=h.userData.shapeRecord;
   targetSpeed=0; targetPitch=0;
   controls.enabled=false;
   draggingHandle={record,surface:record.surface};
   selectedSurface=record.surface;selectedTarget=record.mesh;
   canvas.setPointerCapture(e.pointerId);
   targetSpeed=0;targetPitch=0;
   return;
 }
});
canvas.addEventListener('pointerup',e=>{
 if(draggingHandle){draggingHandle=null;controls.enabled=true;canvas.releasePointerCapture(e.pointerId);canvas.classList.remove('shape-cursor')}
});
canvas.addEventListener('click',e=>{
 if(draggingHandle)return;
 const r=canvas.getBoundingClientRect();
 ray.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-(((e.clientY-r.top)/r.height)*2-1)),camera);
 const hits=ray.intersectObjects(surfaces,true);
 const shapeHit=hits.find(x=>x.object?.userData?.shapeRecord)?.object||null;
 const hit=shapeHit||hits[0]?.object||null;
 if(hit?.userData?.isRightHandle)return;
 if(hit){
   const base=baseSurface(hit);
   selectedTarget=hit;
   openSurfaceTool(base,hit,e.clientX,e.clientY);
 }
});
canvas.addEventListener('pointerleave',()=>{hover(hovered,false);hovered=null;targetSpeed=0;targetPitch=0;canvas.classList.remove('shape-cursor')});
polygonPickerToggle.addEventListener('click',e=>{e.stopPropagation();polygonMenu.classList.toggle('open')});
document.querySelectorAll('.polygon-choice').forEach(b=>b.addEventListener('click',e=>{
 e.stopPropagation();addPolygonToSurface(selectedSurface,b.dataset.shape);
}));
document.getElementById('messengerButton').addEventListener('click',()=>group.visible=true);
document.querySelectorAll('.size-option').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.size-option').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));
document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{
 if(!selectedTarget)return;
 applyDesign(selectedTarget,b);
 const record=selectedTarget.userData.shapeRecord;
 if(record){
   if(b.dataset.pattern){record.texture=leopardTextures[b.dataset.pattern];record.color=0xffffff}
   else{record.texture=null;record.color=new THREE.Color(b.dataset.color)}
   rebuildShape(record);
   selectedTarget=record.mesh;
 }
}));
document.querySelectorAll('.orientation-option').forEach(b=>b.addEventListener('click',e=>{
 e.stopPropagation();
 if(!selectedSurface||selectedSurface.userData.noPolygons)return;
 const records=polygonRecords.get(selectedSurface)||[];
 if(records.length)return;
 polygonOrientation=b.dataset.orientation;
 surfaceOrientations.set(selectedSurface,polygonOrientation);
 document.querySelectorAll('.orientation-option').forEach(x=>{x.disabled=true;x.classList.toggle('active',x===b)});
 updatePolygonStatus();
}));
document.getElementById('resetPolygons').addEventListener('click',e=>{
 e.stopPropagation();
 if(!selectedSurface||selectedSurface.userData.noPolygons)return;
 const records=polygonRecords.get(selectedSurface)||[];
 records.forEach(r=>{if(r.mesh)selectedSurface.remove(r.mesh);if(r.handle)selectedSurface.remove(r.handle);if(r.edge)selectedSurface.remove(r.edge)});
 polygonRecords.delete(selectedSurface);
 surfaceOrientations.delete(selectedSurface);
 polygonOrientation=null;selectedTarget=null;
 document.querySelectorAll('.orientation-option').forEach(x=>{x.disabled=false;x.classList.remove('active')});
 updatePolygonStatus();
});
deleteShapeButton.addEventListener('click',e=>{
 e.stopPropagation();
 const record=selectedTarget?.userData?.shapeRecord;
 if(!record)return;
 const records=polygonRecords.get(record.surface)||[];
 const idx=records.indexOf(record);
 if(idx<0)return;
 records.splice(idx,1);
 records.forEach((r,i)=>{
   r.index=i;
   if(i===0)r.start=0;
   else r.start=records[i-1].end;
 });
 records.forEach(r=>{if(r.mesh)record.surface.remove(r.mesh);if(r.handle)record.surface.remove(r.handle);if(r.edge)record.surface.remove(r.edge)});
 rebuildSurface(record.surface);
 selectedSurface=record.surface;selectedTarget=null;
 polygonOrientation=surfaceOrientations.get(selectedSurface)||null;
 updatePolygonStatus();
});
document.addEventListener('click',e=>{

});

 const item={product:'Messenger Bag',size,addedAt:new Date().toISOString()};
 const cart=JSON.parse(localStorage.getItem('lexisTreeFortCart')||'[]');cart.push(item);localStorage.setItem('lexisTreeFortCart',JSON.stringify(cart));

function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
function animate(){requestAnimationFrame(animate);const shapeMode=!!polygonOrientation||!!draggingHandle||!controls.enabled;if(shapeMode){targetSpeed=0;targetPitch=0}group.rotation.y+=shapeMode?0:targetSpeed;group.rotation.x=Math.max(-.95,Math.min(.95,group.rotation.x+(shapeMode?0:targetPitch)));controls.update();renderer.render(scene,camera)} animate();
</script>
