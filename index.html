<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design | Lexi's Tree Fort</title>
  
  <link rel="icon" sizes="192x192" href="https://static.wixstatic.com/media/9a6a14_328588a7a3164b9e933af5b16a632ddb~mv2.jpg/v1/fill/w_192,h_192,lg_1,usm_0.66_1.00_0.01/9a6a14_328588a7a3164b9e933af5b16a632ddb~mv2.jpg" type="image/jpeg"/>

  <style>
    :root {
      --ltf-teal: #1bb5b2;
      --ltf-pink: #f06292;
      --ltf-darkpink: #e91e63;
      --ltf-yellow: #fcd34d;
      --ltf-orange: #fb923c;
      --ltf-purple: #c084fc;
      --ltf-dark: #222222;
      --site-width: 980px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background-color: #ffffff;
      color: var(--ltf-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ========================================================
       CASCADING BACKGROUND SHAPES
       ======================================================== */
    .shape-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      opacity: 0.85;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.04));
    }

    /* Cascading shapes down the left & right sides */
    .shape-1 { top: 60px; left: -40px; width: 180px; height: 160px; fill: var(--ltf-teal); transform: rotate(-15deg); }
    .shape-2 { top: 180px; right: -30px; width: 200px; height: 220px; fill: var(--ltf-pink); transform: rotate(20deg); }
    .shape-3 { top: 380px; left: 2%; width: 140px; height: 150px; fill: var(--ltf-yellow); transform: rotate(45deg); opacity: 0.7; }
    .shape-4 { top: 520px; right: 4%; width: 160px; height: 170px; fill: var(--ltf-teal); transform: rotate(-25deg); opacity: 0.75; }
    .shape-5 { top: 720px; left: -20px; width: 170px; height: 190px; fill: var(--ltf-orange); transform: rotate(12deg); opacity: 0.7; }
    .shape-6 { top: 860px; right: -20px; width: 190px; height: 180px; fill: var(--ltf-purple); transform: rotate(-18deg); opacity: 0.65; }
    .shape-7 { top: 1040px; left: 3%; width: 150px; height: 150px; fill: var(--ltf-pink); transform: rotate(35deg); opacity: 0.6; }

    /* ========================================================
       TOP HEADER & NAVIGATION
       ======================================================== */
    header {
      position: relative;
      z-index: 10;
      width: 100%;
      text-align: center;
      padding-top: 18px;
    }

    .nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      font-size: 0.95rem;
      letter-spacing: 1px;
      margin-top: 12px;
      margin-bottom: 24px;
    }

    .nav-bar a {
      color: #333333;
      text-decoration: none;
      font-weight: 400;
      transition: color 0.2s;
    }

    .nav-bar a:hover {
      color: var(--ltf-teal);
    }

    .nav-bar a.active {
      color: #333333;
      font-weight: 400;
    }

    .nav-dot {
      color: #888888;
      font-size: 0.8rem;
    }

    /* Sign Foam Board Header Image */
    .header-banner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .header-banner img {
      max-width: 150px;
      width: 40%;
      height: auto;
      border-radius: 0;
      box-shadow: none;
    }

    /* LTF Logo Badge & Etsy Button */




    /* ========================================================
       WHITE SPACE BODY / WORKSPACE AREA
       ======================================================== */
    main {
      position: relative;
      z-index: 10;
      flex: 1;
      width: 100%;
      max-width: 1180px;
      margin: 10px auto 70px auto;
      padding: 0 20px;
    }

    .white-workspace {
      background-color: #ffffff;
      min-height: 760px;
      width: 100%;
      padding: 45px 35px;
      border: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
    }

    .workspace-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #333333;
      margin-bottom: 30px;
      text-transform: uppercase;
    }

    .workspace-placeholder-box {
      width: 100%;
      max-width: 1050px;
      min-height: 620px;
      border: none;
      border-radius: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      padding: 20px;
      margin-top: 0;
    }

    /* ========================================================
       FOOTER
       ======================================================== */
    footer {
      position: relative;
      z-index: 10;
      width: 100%;
      text-align: center;
      padding: 30px 20px 40px 20px;
      font-size: 0.85rem;
      color: #666666;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 14px;
    }

    .social-links a {
      color: #444444;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .social-links a:hover {
      color: var(--ltf-teal);
    }
  </style>
</head>
<body>

<!-- SITE HEADER & NAV -->
  <header>
    <!-- Navigation Links -->
    <nav class="nav-bar">
      <a href="https://www.lexistreefort.com/">Home</a>
      <span class="nav-dot">·</span>
      <a href="https://www.lexistreefort.com/shop-1">Shop</a>
      <span class="nav-dot">·</span>
      <a href="https://www.lexistreefort.com/about">About</a>
      <span class="nav-dot">·</span>
      <a href="https://www.lexistreefort.com/events">Events</a>
      <span class="nav-dot">·</span>
      <a href="https://www.lexistreefort.com/contact">Contact</a>
    </nav>

    <!-- Site logo -->
    <div class="header-banner">
      <img src="https://static.wixstatic.com/media/9a6a14_b0a7629f76d040879556d83d4db846db~mv2.jpg/v1/crop/x_5,y_0,w_604,h_672/fill/w_150,h_167,al_c,q_80,usm_0.66_1.00_0.01/LTF_logoTealPink.jpg" alt="Lexi's Tree Fort">
    </div>
  </header>

  <!-- BODY CONTENT: CLEAN WHITE SPACE WORKSPACE -->
  <main>
    <div class="white-workspace">
      <h1 class="workspace-title">Custom Bag Designer</h1>
<div class="workspace-placeholder-box">
        <p>[ Custom Bag Design Application Area ]</p>
      </div>
    </div>
  </main>

  <!-- SITE FOOTER -->
  <footer>
    <div class="social-links">
      <a href="https://www.instagram.com/lexistreefort/" target="_blank">Instagram</a>
      <span class="nav-dot">·</span>
      <a href="https://www.facebook.com/lexistreefort/" target="_blank">Facebook</a>
    </div>
    <p>&copy; 2026 by Lexi's Tree Fort.</p>
  </footer>

</body>
</html>
